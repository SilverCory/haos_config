# Board: DOIT ESP32 DEVKIT V1 (DOIT)
# Definition: definitions/boards/esp32doit-devkit-v1/manifest.yaml

esphome:
  name: tv-light-controller
  friendly_name: TV Light Controller

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "ReZpJ1duwBiby0QIyOznga4vrDjdt7LbLAAvVjWM6dg="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: TV Light Contro Fallback Hotspot
    password: "gF5a5mGA1r1J"

web_server:
captive_portal:

script:
  - id: rave_strobe
    then:
      - while:
          condition:
            switch.is_on: rave_mode
          then:
            - switch.turn_on: switch_gpio_1
            - switch.turn_on: switch_gpio_2
            - delay: 100ms
            - switch.turn_off: switch_gpio_1
            - switch.turn_off: switch_gpio_2
            - delay: 100ms

switch:
  - platform: gpio
    name: TV Street Lamp
    id: switch_gpio_1
    pin: GPIO12
    
  - platform: gpio
    name: TV Snow House
    id: switch_gpio_2
    pin: GPIO14
    
  - platform: template
    name: "Rave Mode"
    id: rave_mode
    optimistic: true
    turn_on_action:
      - script.execute: rave_strobe
    turn_off_action:
      - script.stop: rave_strobe
      - switch.turn_off: switch_gpio_1
      - switch.turn_off: switch_gpio_2