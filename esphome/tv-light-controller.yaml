# Board: DOIT ESP32 DEVKIT V1 (DOIT)
# Definition: definitions/boards/esp32doit-devkit-v1/manifest.yaml

esphome:
  name: tv-light-controller
  friendly_name: TV Light Controller

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  # Turns off logging for lights, switches, and outputs
  logs:
    light: NONE
    switch: NONE
    output: NONE

api:
  encryption:
    key: "ReZpJ1duwBiby0QIyOznga4vrDjdt7LbLAAvVjWM6dg="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: TV Light Contro Fallback Hotspot
    password: "gF5a5mGA1r1J"

web_server:
captive_portal:

output:
  - platform: gpio
    id: output_gpio_1
    pin: GPIO12
    
  - platform: gpio
    id: output_gpio_2
    pin: GPIO14

script:
  - id: rave_strobe
    then:
      - while:
          condition:
            switch.is_on: rave_mode
          then:
            - light.turn_on: light_gpio_1
            - light.turn_off: light_gpio_2
            - delay: 100ms
            - light.turn_off: light_gpio_1
            - light.turn_on: light_gpio_2
            - delay: 100ms

light:
  - platform: binary
    name: TV Street Lamp
    id: light_gpio_1
    output: output_gpio_1
    
  - platform: binary
    name: TV Snow House
    id: light_gpio_2
    output: output_gpio_2
    
switch:
  - platform: template
    name: "Rave Mode"
    id: rave_mode
    turn_on_action:
      # Explicitly set state to ON before starting the loop
      - switch.template.publish:
          id: rave_mode
          state: ON
      - script.execute: rave_strobe
    turn_off_action:
      # Explicitly set state to OFF and kill the script
      - switch.template.publish:
          id: rave_mode
          state: OFF
      - script.stop: rave_strobe
      - light.turn_off: light_gpio_1
      - light.turn_off: light_gpio_2