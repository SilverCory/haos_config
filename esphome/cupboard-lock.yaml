esphome:
  name: cupboard-lock
  friendly_name: cupboard-lock

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "JFlo/6wQi8xA+PVIo/i93CXRuWzMjmljfsH+buX1hLM="

ota:
  - platform: esphome
    password: "bf8b1512a4436a61972e9defced72666"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Cupboard-Lock Fallback Hotspot"
    password: "S5sIRG3PyVA9"

web_server:
 port: 80

captive_portal:

substitutions:
  door_lock_pulse_time: '200ms'

esp32_touch:

binary_sensor:
  - platform: gpio
    pin: GPIO4
    id: door_closed_a
    name: "Door Closed Switch A"
    device_class: opening  # Indicates if door is closed
    internal: True
  - platform: gpio
    pin: GPIO5
    id: door_closed_b
    name: "Door Closed Switch B"
    device_class: opening  # Indicates if door is closed
    internal: True
  - platform: esp32_touch
    name: "ESP32 Touch Pad"
    pin: GPIO2
    threshold: 1000
    on_double_click: 
      then:
        - button.press: lock_a_button
        - button.press: lock_b_button

output:
  - platform: gpio
    pin: GPIO17
    id: 'lock_a'
  - platform: gpio
    pin: GPIO16
    id: 'lock_b'

button:
  - platform: output
    name: 'Unlock Double Door'
    id: 'lock_a_button'
    output: lock_a
    duration: ${door_lock_pulse_time}
    internal: False
  - platform: output
    name: 'Unlock Single Door'
    id: 'lock_b_button'
    output: lock_b
    duration: ${door_lock_pulse_time}
    internal: False

lock:
  - platform: template
    name: "Double Door Lock"
    lambda: |-
      if (id(door_closed_a).state) {
        return LOCK_STATE_LOCKED;
      } else {
        return LOCK_STATE_UNLOCKED;
      }
    open_action: []
    lock_action: []
    unlock_action: []
  - platform: template
    name: "Single Door Lock"
    lambda: |-
      if (id(door_closed_b).state) {
        return LOCK_STATE_LOCKED;
      } else {
        return LOCK_STATE_UNLOCKED;
      }
    open_action: []
    lock_action: []
    unlock_action: []
        
