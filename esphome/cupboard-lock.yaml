esphome:
  name: cupboard-lock
  friendly_name: cupboard-lock

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "JFlo/6wQi8xA+PVIo/i93CXRuWzMjmljfsH+buX1hLM="

ota:
  - platform: esphome
    password: "bf8b1512a4436a61972e9defced72666"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Cupboard-Lock Fallback Hotspot"
    password: "S5sIRG3PyVA9"

web_server:
 port: 80

captive_portal:

substitutions:
  door_lock_pulse_time: '200ms'

esp32_touch:
  setup_mode: False

binary_sensor:
  - platform: gpio
    pin: GPIO4
    id: door_closed_double
    name: "Double Door"
    device_class: lock  # Indicates if door is closed
    internal: False
  - platform: gpio
    pin: GPIO5
    id: door_closed_single
    name: "Single Door"
    device_class: lock  # Indicates if door is closed
    internal: False
  - platform: esp32_touch
    name: "Secret Touch Open"
    pin: GPIO2
    threshold: 500
    on_double_click: 
      then:
        - button.press: lock_double_button
        - button.press: lock_single_button

output:
  - platform: gpio
    pin: GPIO17
    id: 'lock_double'
  - platform: gpio
    pin: GPIO16
    id: 'lock_single'

button:
  - platform: output
    name: 'Unlock Double Door'
    id: 'lock_double_button'
    output: lock_double
    duration: ${door_lock_pulse_time}
    internal: False
  - platform: output
    name: 'Unlock Single Door'
    id: 'lock_single_button'
    output: lock_single
    duration: ${door_lock_pulse_time}
    internal: False
