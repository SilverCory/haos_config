esphome:
  name: cupboard-lock
  friendly_name: cupboard-lock

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "JFlo/6wQi8xA+PVIo/i93CXRuWzMjmljfsH+buX1hLM="

ota:
  - platform: esphome
    password: "bf8b1512a4436a61972e9defced72666"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Cupboard-Lock Fallback Hotspot"
    password: "S5sIRG3PyVA9"

web_server:
 port: 80

captive_portal:

substitutions:
  door_lock_pulse_time: '200ms'

output:
  - platform: gpio
    pin: GPIO17
    id: 'lock_a'
  - platform: gpio
    pin: GPIO16
    id: 'lock_b'

button:
  - platform: output
    id: 'lock_a_button'
    output: lock_a
    duration: 150ms
    internal: True
  - platform: output
    id: 'lock_b_button'
    output: lock_b
    duration: 150ms
    internal: True

lock:
  - platform: template
    name: "Double Door Lock"
    optimistic: True
    open_action:
      - button.press: lock_a_button
  - platform: template
    name: "Single Door Lock"
    optimistic: True
    open_action:
      - button.press: lock_b_button
