# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: esp32-rf433-cc1101-hub
  friendly_name: esp32-rf433-cc1101-hub

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "QLbMSMIDaszUyOjes/NeMJYFJiXWN6cfLOVCcJ+eOQg="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esp32-rf433-cc1 Fallback Hotspot
    password: "cDR69tWn8WZg"

captive_portal:

web_server:

# Pull in the rtl_433 custom component for the TPMS
external_components:
  - source:
      type: git
      url: https://github.com/NorthernMan54/esphome-rtl433
      ref: main

# Define the shared SPI bus
spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO22 

# ----------------------------------------------------
# Module 1: Doorbell Transceiver (ASK/OOK)
# ----------------------------------------------------
cc1101:
  cs_pin: GPIO26
  gdo0_pin: 
    number: GPIO25
    allow_other_uses: true
  frequency: 433.92MHz
  modulation_type: ASK/OOK

# Receives doorbell presses from physical buttons outside
remote_receiver:
  pin: 
    number: GPIO25
    allow_other_uses: true
  dump: all

# Transmits to your internal doorbell chimes (replaces GPIO4)
remote_transmitter:
  pin: 
    number: GPIO25
    allow_other_uses: true
  carrier_duty_percent: 100%

# ----------------------------------------------------
# Module 2: TPMS Receiver (FSK)
# ----------------------------------------------------
rtl_433:
  cc1101_cs_pin: GPIO14
  cc1101_gdo0_pin: GPIO27

sensor:
  - platform: rtl_433
    name: "R1200RT Front Tire Pressure"
    device_id: "0A1B2C" # Replace with your actual sensor ID
    sensor_type: "pressure_kPa"
    filters:
      - multiply: 0.145038
    unit_of_measurement: "psi"
    device_class: pressure

  - platform: rtl_433
    name: "R1200RT Front Tire Temperature"
    device_id: "0A1B2C" # Replace with your actual sensor ID
    sensor_type: "temperature_C"
    unit_of_measurement: "°C"
    device_class: temperature

# ----------------------------------------------------
# Doorbell Automation Logic
# ----------------------------------------------------
switch:
  - platform: template
    name: "Doorbell Ring Lock"
    id: doorbell_lock
    internal: true
    optimistic: true
    on_turn_on: 
      then:
        - logger.log: "Doorbell Chime Triggered. Lock active for 10s."
        - delay: 10s
        - switch.turn_off: doorbell_lock

button:
  - platform: template
    name: Doorbell Chime Ring
    icon: mdi:bell-ring
    id: doorbell_chime_button
    on_press:
      - if:
          condition:
            switch.is_off: doorbell_lock
          then:
            - switch.turn_on: doorbell_lock
            # This will now transmit directly through the CC1101 on GPIO25
            - remote_transmitter.transmit_rc_switch_raw:
                code: '101111000110001101000011'
                protocol: 
                  pulse_length: 185
                repeat:
                  times: 10
                  wait_time: 0s