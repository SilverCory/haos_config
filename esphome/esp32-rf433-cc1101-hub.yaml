# ============================================================
# ESP Hub -- Doorbell Transceiver + TPMS Receiver
# ============================================================
# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml
#
# This node drives two CC1101 modules on a shared SPI bus,
# both managed by the ESPHome native cc1101 component:
#
#   Module 1 -- Doorbell Transceiver (ASK/OOK, CC1101 #1)
#     id: doorbell_radio
#     CS=GPIO26, GDO0=GPIO25, 433.92 MHz
#     RX: remote_receiver on GPIO25 decodes incoming button presses.
#     TX: bit-banged OOK via gpio_set_level() in a critical section,
#         bypassing remote_transmitter entirely (RMT GPIO matrix
#         routing is broken by CC1101 pin_mode calls).
#
#   Module 2 -- TPMS Receiver (ASK/OOK, CC1101 #2)
#     id: tpms_radio
#     CS=GPIO14, GDO0=GPIO27, 433.92 MHz
#     Uses packet_mode to receive raw Schrader EG53MA4 frames.
#     Decoded in an on_packet lambda and published to template
#     sensors.
#
#   Shared SPI pins: CLK=GPIO18, MISO=GPIO19, MOSI=GPIO22
#
# Both CC1101 modules share the same ESPHome-managed SPI bus
# (VSPI peripheral). The ESPHome SPI driver handles chip-select
# arbitration, so there is no dual-driver race condition.
#
# The TPMS CC1101 runs in packet_mode with sync_mode disabled.
# The on_packet lambda logs ALL received packets as a hex dump
# (tagged [tpms_raw]) BEFORE checksum validation, so nothing is
# silently discarded. Valid EG53MA4 frames are then decoded and
# logged with [tpms] including the sensor ID in hex.
#
# A 60-minute interval resets the TPMS radio as a workaround
# for the CC1101 "deaf" hardware quirk where the receiver
# occasionally stops receiving until reset.
# ============================================================

esphome:
  name: esp32-rf433-cc1101-hub
  friendly_name: esp32-rf433-cc1101-hub
  includes:
    - doorbell_rx_helper.h
  on_boot:
    priority: -100
    then:
      - cc1101.begin_rx:
          id: doorbell_radio
      - cc1101.begin_rx:
          id: tpms_radio

esp32:
  board: esp32dev
  variant: ESP32
  framework:
    type: esp-idf
logger:

api:
  encryption:
    key: Hk6Db2KpybEaGWudYj0VSxacBrWdrYYxh+2UVuzKEq4=

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esp32-rf433-cc1 Fallback Hotspot
    password: pke0COUPOvSB

captive_portal:

web_server:

safe_mode:
  boot_is_good_after: 30min
  num_attempts: 5

# ============================================================
# Shared SPI Bus
# ============================================================
# Both CC1101 modules share this bus. The ESPHome SPI driver
# manages chip-select lines so only one device is active at a
# time -- no mutex issues.
# ------------------------------------------------------------

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO22
  id: cc1101_spi

# ============================================================
# Module 1: Doorbell Transceiver (ASK/OOK, CC1101 #1)
# ============================================================
# The doorbell CC1101 is wired to GPIO25 (GDO0). The cc1101
# component manages the radio via SPI. remote_receiver listens
# on GPIO25 (allow_other_uses) for incoming button presses.
# TX is bit-banged directly in the button lambda.
# ------------------------------------------------------------

# ============================================================
# Module 2: TPMS Receiver (ASK/OOK, CC1101 #2)
# ============================================================
# The TPMS CC1101 is wired to CS=GPIO14, GDO0=GPIO27.
# It uses packet_mode to receive raw Schrader EG53MA4 frames.
#
# Schrader EG53MA4 protocol (OOK + Manchester, 120 bits):
#   40-bit preamble/sync + 80 data bits (10 bytes)
#
# Packet byte layout (b[0]-b[9]):
#   b[0]-b[3]: flags (32-bit)
#   b[4]-b[6]: sensor ID (24-bit big-endian)
#   b[7]:      pressure in units of 25 mbar (pressure_kPa = b[7] * 2.5)
#   b[8]:      temperature in raw deg F (temp_C = (b[8] - 32) * 5/9)
#   b[9]:      checksum = sum(b[0..8]) & 0xFF
#
# sync_mode is set to None because the exact 2-byte CC1101 sync
# word for EG53MA4 is not definitively documented. All frame
# validation is done by checksum in the on_packet lambda. This
# means more noise packets are received, but all invalid ones
# are discarded by the checksum check.
# ------------------------------------------------------------

cc1101:
  # -- Module 1: Doorbell --
  - id: doorbell_radio
    spi_id: cc1101_spi
    cs_pin: GPIO26
    gdo0_pin:
      number: GPIO25
      allow_other_uses: true
    frequency: 433.92MHz
    modulation_type: ASK/OOK

  # -- Module 2: TPMS Receiver --
  - id: tpms_radio
    spi_id: cc1101_spi
    cs_pin: GPIO14
    gdo0_pin: GPIO27
    frequency: 433.92MHz
    modulation_type: ASK/OOK
    manchester: false
    symbol_rate: 4159
    filter_bandwidth: 58kHz
    rx_attenuation: 0dB
    packet_mode: true
    packet_length: 64
    sync_mode: None
    num_preamble: 0
    on_packet:
      then:
        - lambda: |-
            // ---- Raw hex dump of EVERY received packet ----
            // This runs BEFORE any filtering so you can see all radio
            // traffic, including packets that fail checksum or have an
            // unexpected length.  Use this output to visually identify
            // your sensor ID bytes when using a TPMS activation tool.
            //
            // Example output:
            //   [tpms_raw] 10 bytes: AA BB CC DD 0A 1B 2C 64 48 XX
            //   [tpms] ID=0A1B2C [Front Wheel] pressure=36.2 psi temp=20.0 C
            //
            // For packets that fail checksum or are the wrong length:
            //   [tpms_raw] 7 bytes: AA BB CC 0A 1B 2C DD

            // ---- Raw hex dump (non-zero packets only) ----
            bool has_nonzero = false;
            for (size_t i = 1; i < x.size(); i++) { if (x[i]) { has_nonzero = true; break; } }
            if (has_nonzero) {
              char hex[200];
              int hpos = 0;
              for (size_t i = 0; i < x.size() && hpos < (int)sizeof(hex) - 4; i++) {
                if (i > 0) hex[hpos++] = ' ';
                hpos += snprintf(hex + hpos, sizeof(hex) - hpos, "%02X", x[i]);
              }
              hex[hpos] = '\0';
              ESP_LOGI("tpms_raw", "%u bytes: %s", (unsigned)x.size(), hex);
            }

            // ---- Software Manchester decode ----
            // At 4159 baud, each CC1101 bit = one Manchester chip (123µs/chip).
            // 64 bytes = 512 chips. EG53MA4: 40-bit preamble (AA AA AA AA AA) + 80 data bits = 120 chips.
            // Search for Manchester preamble (0xAA = 10101010) then decode 80 Manchester bits.
            // Manchester zerobit: chip pair 10->1, 01->0.

            int nbits = (int)x.size() * 8;
            auto get_bit = [&](int i) -> int {
              if (i < 0 || i >= nbits) return 0;
              return (x[i / 8] >> (7 - (i % 8))) & 1;
            };

            // Find last run of at least 8 consecutive alternating bits (preamble)
            // then try Manchester decode starting from that point (both chip-phases)
            bool decoded_ok = false;
            for (int start = 0; start <= nbits - 160 && !decoded_ok; start++) {
              // Check at least 8 alternating chips from 'start'
              bool is_preamble = true;
              for (int k = 0; k < 8; k++) {
                if (get_bit(start + k) != (1 - (k & 1))) { is_preamble = false; break; }
              }
              if (!is_preamble) continue;

              // Skip to end of preamble run
              int pos = start;
              while (pos + 1 < nbits && get_bit(pos) != get_bit(pos + 1)) pos++;
              // pos now at last alternating chip; data starts at pos+1 (next chip pair)
              // Try both phases
              for (int phase = 0; phase <= 1 && !decoded_ok; phase++) {
                int dstart = pos + 1 + phase;
                if (dstart + 160 > nbits) break;

                uint8_t dec[10] = {};
                bool valid = true;
                for (int b = 0; b < 80; b++) {
                  int p = dstart + b * 2;
                  int c0 = get_bit(p), c1 = get_bit(p + 1);
                  if (c0 == c1) { valid = false; break; }
                  dec[b / 8] |= (c0 << (7 - (b % 8)));
                }
                if (!valid) continue;
                if (dec[0] == 0xFF && dec[1] == 0xFF && dec[2] == 0xFF) continue;
                if (!dec[0] && !dec[1] && !dec[2] && !dec[3]) continue;

                uint8_t chk = 0;
                for (int i = 0; i < 9; i++) chk += dec[i];
                if (chk != dec[9]) continue;

                decoded_ok = true;
                uint32_t sensor_id = ((uint32_t)dec[4] << 16) | ((uint32_t)dec[5] << 8) | dec[6];
                float pressure_kpa = dec[7] * 2.5f;
                float pressure_psi = pressure_kpa * 0.145038f;
                float temp_c = ((float)dec[8] - 32.0f) * 5.0f / 9.0f;

                struct TpmsSensor {
                  uint32_t sensor_id;
                  const char* name;
                  sensor::Sensor* pressure;
                  sensor::Sensor* temperature;
                };
                const TpmsSensor sensors[] = {
                  {0x2242BA, "Front Wheel", id(tpms_front_pressure),  id(tpms_front_temperature)},
                  {0x2242E1, "Rear Wheel",  id(tpms_rear_pressure),   id(tpms_rear_temperature)},
                };

                bool matched = false;
                for (const auto& s : sensors) {
                  if (sensor_id == s.sensor_id) {
                    s.pressure->publish_state(pressure_psi);
                    s.temperature->publish_state(temp_c);
                    ESP_LOGI("tpms", "ID=%06X [%s] pressure=%.1f psi temp=%.1f C",
                             sensor_id, s.name, pressure_psi, temp_c);
                    matched = true;
                    break;
                  }
                }
                if (!matched) {
                  ESP_LOGI("tpms", "ID=%06X [unknown] pressure=%.1f psi temp=%.1f C (raw P=%u T=%u)",
                           sensor_id, pressure_psi, temp_c, dec[7], dec[8]);
                }
              }
            }

# ============================================================
# Doorbell Remote Receiver
# ============================================================
# Receives doorbell presses from physical buttons outside.
# Decodes RC switch protocols only to avoid log flooding.
# TX is done via bit-bang in the button lambda (see below).
# ------------------------------------------------------------

remote_receiver:
  id: doorbell_receiver
  pin:
    number: GPIO25
    allow_other_uses: true
  dump: rc_switch

# ============================================================
# TPMS Template Sensors
# ============================================================
# Each physical TPMS sensor gets its own pressure + temperature
# pair. The on_packet lambda dispatch table (above) routes
# decoded frames to the correct sensors by matching the 24-bit
# sensor ID.
#
# To add a new TPMS sensor:
#   1. Copy one pressure + temperature pair below and change
#      the 'name' and 'id' fields to match your new sensor.
#   2. Add a matching row to the dispatch table in the
#      on_packet lambda (in the cc1101 TPMS section above).
#   3. Flash the updated firmware.
#
# To discover your real sensor IDs:
#   1. Use a TPMS activation tool to wake the Schrader EG53MA4
#   2. Watch the ESPHome log for [tpms] entries
#   3. The log shows ID=XXXXXX -- use that hex value in the
#      dispatch table
#
# The IDs below (0x000FFF, etc.) are placeholders until real
# sensor IDs are discovered.
# ------------------------------------------------------------

sensor:
  # -- Front Wheel (ID: 0x2242BA / 2242810) --
  - platform: template
    name: "TPMS Front Wheel Pressure"
    id: tpms_front_pressure
    unit_of_measurement: "psi"
    device_class: pressure
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "TPMS Front Wheel Temperature"
    id: tpms_front_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement

  # -- Rear Wheel (ID: 0x2242E1 / 2244065) --
  - platform: template
    name: "TPMS Rear Wheel Pressure"
    id: tpms_rear_pressure
    unit_of_measurement: "psi"
    device_class: pressure
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "TPMS Rear Wheel Temperature"
    id: tpms_rear_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement


# ============================================================
# TPMS Radio Deaf Workaround
# ============================================================
# The CC1101 can occasionally stop receiving (known hardware
# quirk). This interval resets the TPMS radio every 60 minutes
# and puts it back into RX mode to recover.
# ------------------------------------------------------------

interval:
  - interval: 60min
    then:
      - cc1101.reset:
          id: tpms_radio
      - cc1101.begin_rx:
          id: tpms_radio

# ============================================================
# Doorbell Automation Logic
# ============================================================
# A template switch acts as a 10-second lock-out to prevent
# repeated chime triggers. The button bit-bangs the OOK signal
# directly on GPIO25 (GDO0) via doorbell_bitbang_ook().
# ------------------------------------------------------------

switch:
  - platform: template
    name: "Doorbell Ring Lock"
    id: doorbell_lock
    internal: true
    optimistic: true
    on_turn_on:
      then:
        - logger.log: "Doorbell Chime Triggered. Lock active for 10s."
        - delay: 10s
        - switch.turn_off: doorbell_lock

button:
  - platform: template
    name: Doorbell Chime Ring
    icon: mdi:bell-ring
    id: doorbell_chime_button
    on_press:
      - if:
          condition:
            switch.is_off: doorbell_lock
          then:
            - switch.turn_on: doorbell_lock
            - logger.log: "Doorbell TX starting"
            - lambda: |-
                // Bit-bang OOK doorbell signal directly on GPIO25 (GDO0).
                //
                // We bypass cc1101.begin_tx() entirely because it calls
                // gdo0_pin_->pin_mode(FLAG_OUTPUT) which re-routes GPIO25
                // through the plain CPU GPIO output path. That's fine for
                // bit-bang, but it also detaches the CC1101 interrupt, which
                // begin_tx normally manages. We replicate only what we need:
                //  1. Set PKTCTRL0=0x32 (async serial TX mode) via SPI
                //  2. Strobe CC1101 to IDLE then into TX
                //  3. Configure GPIO25 as plain output
                //  4. Bit-bang the OOK pulse train via gpio_set_level + ets_delay_us
                //     inside a critical section for deterministic timing
                //  5. Call begin_rx() normally to restore RX mode

                using namespace esphome::cc1101;
                auto *radio = id(doorbell_radio);

                // Step 1: Set async serial TX mode (PKTCTRL0 = 0x32)
                // Bit[5:4]=11 = async serial mode; Bit[1]=1 = infinite packet length
                DoorbellCC1101Helper::pub_write(radio, Register::PKTCTRL0, 0x32);

                // Step 2: Strobe IDLE then TX (mirrors begin_tx without pin_mode)
                DoorbellCC1101Helper::pub_enter_idle(radio);
                bool tx_ok = DoorbellCC1101Helper::pub_enter_tx(radio);
                if (!tx_ok) {
                  ESP_LOGW("doorbell", "CC1101 failed to enter TX state");
                }

                // Step 3: Configure GPIO25 as plain output for bit-bang
                // (CC1101 async serial mode: GDO0 is the serial data INPUT from ESP)
                gpio_config_t io_conf = {};
                io_conf.pin_bit_mask = (1ULL << 25);
                io_conf.mode = GPIO_MODE_OUTPUT;
                io_conf.pull_up_en = GPIO_PULLUP_DISABLE;
                io_conf.pull_down_en = GPIO_PULLDOWN_DISABLE;
                io_conf.intr_type = GPIO_INTR_DISABLE;
                gpio_config(&io_conf);

                // Step 4: Bit-bang the captured doorbell signal 20 times.
                // Timings in µs — positive = ON (carrier), negative = OFF.
                // Source: raw dump from physical button press on GPIO25/GDO0.
                static const int32_t pulses[] = {
                  571, -220, 168, -560, 559, -194, 551, -237, 533, -212,
                  571, -197, 169, -586, 171, -577, 170, -576, 559, -213,
                  564, -182, 184, -580, 181, -553, 184, -578, 557, -197,
                  583, -172, 186, -603, 541, -207, 166, -579, 177, -576,
                  172, -579, 171, -574, 559, -212, 558, -205, 180
                };
                // The last entry in the captured signal is a ~5780µs inter-repeat
                // gap. We handle inter-repeat spacing explicitly so we don't
                // include it in the pulse array (doorbell_bitbang_ook adds its own
                // gap between repeats).
                doorbell_bitbang_ook(25, pulses,
                                     sizeof(pulses) / sizeof(pulses[0]),
                                     20, 5780);

                // Step 5: Return CC1101 to RX mode WITHOUT calling pin_mode(FLAG_INPUT).
                // begin_rx() calls pin_mode(FLAG_INPUT) which disables the GPIO25
                // output driver, so gpio_set_level() silently does nothing on the
                // next TX cycle. pub_enter_rx() skips that call.
                DoorbellCC1101Helper::pub_enter_rx(radio);

                ESP_LOGI("doorbell", "Doorbell TX done");
