# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: esp32-rf433-cc1101-hub
  friendly_name: esp32-rf433-cc1101-hub
  libraries:
    - "SPI"
  platformio_options:
    extra_scripts:
      - pre:/config/esphome/remove_dup.py

esp32:
  variant: esp32
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "Hk6Db2KpybEaGWudYj0VSxacBrWdrYYxh+2UVuzKEq4="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esp32-rf433-cc1 Fallback Hotspot
    password: "pke0COUPOvSB"

captive_portal:

web_server:
  

# ============================================================
# ESP Hub — Doorbell Transceiver + TPMS Receiver
# ============================================================
#
# This node drives two CC1101 modules on a shared SPI bus:
#
#   Module 1 — Doorbell (ASK/OOK, CC1101 #1)
#     CS=GPIO26, GDO0=GPIO25, 433.92 MHz
#     Handled by ESPHome native remote_receiver / remote_transmitter.
#
#   Module 2 — TPMS Receiver (FSK, CC1101 #2)
#     CS=GPIO14, GDO0=GPIO27
#     Handled by the rtl433 external component (SilverCory/esphome_rtl433).
#
#   Shared SPI: CLK=GPIO18, MISO=GPIO19, MOSI=GPIO22
#
# Note: the rtl433 component only supports a single instance.
# The doorbell CC1101 is driven entirely through remote_receiver /
# remote_transmitter on its GDO0 pin and does not need rtl433.
# ============================================================

# ------------------------------------------------------------
# Pull in the rtl433 external component for the TPMS CC1101
# ------------------------------------------------------------
external_components:
  - source: github://SilverCory/esphome_rtl433@master
    components: [rtl433]


# ============================================================
# Module 1: Doorbell Transceiver (ASK/OOK, CC1101 #1)
# ============================================================
# The doorbell CC1101 is wired to GPIO25 (GDO0). ESPHome's
# remote_receiver and remote_transmitter share this pin to
# receive doorbell button presses and transmit chime codes.
# No rtl433 involvement — purely native ESPHome components.
# ------------------------------------------------------------

# Receives doorbell presses from physical buttons outside
remote_receiver:
  pin:
    number: GPIO25
    allow_other_uses: true
  dump: all

# Transmits to your internal doorbell chimes
remote_transmitter:
  pin:
    number: GPIO25
    allow_other_uses: true
  carrier_duty_percent: 100%

# ============================================================
# Module 2: TPMS Receiver (FSK, CC1101 #2)
# ============================================================
# The TPMS CC1101 is wired to CS=GPIO14, GDO0=GPIO27.
# SPI pins are passed directly to the rtl433 component
# (the top-level spi: block is NOT used by this component).
# ------------------------------------------------------------

rtl433:
  cs_pin: 14
  gdo0_pin: 27
  clk_pin: 18
  miso_pin: 19
  mosi_pin: 22
  frequency: 433.92
  modulation: FSK

# ============================================================
# TPMS Sensors (native rtl433 platform)
# ============================================================
# These sensors subscribe directly to decoded rtl433 messages.
# No on_message lambda or json: component needed.
# ------------------------------------------------------------

sensor:
  - platform: rtl433
    name: "R1200RT Front Tire Pressure"
    sensor_device_model: "Schrader-EG53MA4"
    sensor_device_id: "0A1B2C"
    sensor_field: pressure_kPa
    unit_of_measurement: "psi"
    filters:
      - multiply: 0.145038
    device_class: pressure
    accuracy_decimals: 1

  - platform: rtl433
    name: "R1200RT Front Tire Temperature"
    sensor_device_model: "Schrader-EG53MA4"
    sensor_device_id: "0A1B2C"
    sensor_field: temperature_C
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1

# ============================================================
# Doorbell Automation Logic
# ============================================================
# A template switch acts as a 10-second lock-out to prevent
# repeated chime triggers. The button triggers the RC switch
# code transmission through the doorbell CC1101.
# ------------------------------------------------------------

switch:
  - platform: template
    name: "Doorbell Ring Lock"
    id: doorbell_lock
    internal: true
    optimistic: true
    on_turn_on:
      then:
        - logger.log: "Doorbell Chime Triggered. Lock active for 10s."
        - delay: 10s
        - switch.turn_off: doorbell_lock

button:
  - platform: template
    name: Doorbell Chime Ring
    icon: mdi:bell-ring
    id: doorbell_chime_button
    on_press:
      - if:
          condition:
            switch.is_off: doorbell_lock
          then:
            - switch.turn_on: doorbell_lock
            # Transmits directly through the doorbell CC1101 on GPIO25
            - remote_transmitter.transmit_rc_switch_raw:
                code: '101111000110001101000011'
                protocol:
                  pulse_length: 185
                repeat:
                  times: 10
                  wait_time: 0s
