esphome:
  name: esp-rf433-hub
  friendly_name: esp-rf433-hub

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "oFIaGUx/WOgoQg9qT7P9Eel6Mg2NhCbm/g03tepPPiU="

ota:
  - platform: esphome
    password: "0cd40678b1f9112159e182e19b23c7b1"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp-Rf433-Hub Fallback Hotspot"
    password: "jfykVNNuoyxv"

web_server:
 port: 80

captive_portal:

remote_receiver:
  pin: GPIO0
  dump: all

remote_transmitter:
  pin: 4
  carrier_duty_percent: 100%

button:
  - platform: template
    name: Doorbell Chime Ring
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: '101111000110001101000011'
          protocol: 1
          repeat:
            times: 10
            wait_time: 0s